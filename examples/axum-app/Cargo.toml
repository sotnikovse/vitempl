[package]
name = "axum-app"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
askama = "0.16"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
