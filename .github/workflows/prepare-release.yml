name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        default: vitempl
        type: choice
        options:
          - vitempl
          - vite-plugin-sfce
          - "@vitempl/eslint-plugin"
      release:
        description: Release type
        required: true
        default: next
        type: choice
        options:
          - next
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
      version:
        description: Specify exact version instead of release type
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package }}-${{ inputs.version || inputs.release }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: github.repository == 'sotnikovse/vitempl'
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare release
        id: prepare
        env:
          RELEASE: ${{ inputs.version || inputs.release }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: |
          node scripts/prepare-release.ts "$RELEASE_PACKAGE" "$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Resolve package path
        id: path
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: echo "path=packages/${RELEASE_PACKAGE#@vitempl/}" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        uses: vitejs/release-scripts/action/release-pr@083fcf277cb3edc873f60d820738be35323d14e7 # v1.10.0
        with:
          token: ${{ github.token }}
          package-name: ${{ inputs.package }}
          package-path: ${{ steps.path.outputs.path }}
          pr-body: ${{ steps.prepare.outputs.pr_body }}
          tag: ${{ steps.prepare.outputs.tag }}
          target-branch: main
          version: ${{ steps.prepare.outputs.version }}
