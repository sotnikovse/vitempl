name: Publish Package

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  detect-release:
    if: github.repository == 'sotnikovse/vitempl'
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.detect.outputs.package }}
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect release
        id: detect
        run: node scripts/detect-release.ts "$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

  publish-release:
    if: needs.detect-release.outputs.release == 'true'
    needs: detect-release
    name: Publish ${{ needs.detect-release.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        env:
          TAG: ${{ needs.detect-release.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.detect-release.outputs.tag }}
        run: node scripts/publishCI.ts "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          PACKAGE: ${{ needs.detect-release.outputs.package }}
          TAG: ${{ needs.detect-release.outputs.tag }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          pkg_dir="packages/${PACKAGE#@vitempl/}"
          node scripts/extract-changelog.ts "$pkg_dir/CHANGELOG.md" "$VERSION" > "$NOTES_FILE"

          prerelease=()
          if [[ "${VERSION%%+*}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            "${prerelease[@]}"
